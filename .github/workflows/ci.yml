name: EVCP CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # Continuous Integration (CI)
  # ============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -v

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-checks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t evcp-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t evcp-frontend:ci ./frontend

  # ============================================================================
  # Continuous Deployment (CD)
  # ============================================================================
  deploy:
    name: Continuous Deployment (Docker Compose)
    runs-on: ubuntu-latest
    needs:
      - docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose stack
        run: docker compose build

      # --wait blocks until every service's healthcheck passes (backend, frontend,
      # Prometheus and Grafana), not just the backend; Grafana alone can take ~20s.
      - name: Deploy application containers and wait for health
        run: docker compose up -d --wait --wait-timeout 180

      - name: Health Check Verification
        run: |
          echo "Testing Backend /health endpoint..."
          curl -f http://localhost:8000/health || (echo "Health check failed" && exit 1)
          echo "Testing Frontend /nginx-health endpoint..."
          curl -f http://localhost:3000/nginx-health || (echo "Frontend check failed" && exit 1)
          echo "Testing Prometheus /-/healthy endpoint..."
          curl -f http://localhost:9090/-/healthy || (echo "Prometheus check failed" && exit 1)
          echo "Testing Grafana /api/health endpoint..."
          curl -f http://localhost:3001/api/health || (echo "Grafana check failed" && exit 1)

      - name: Dump service status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 200

      - name: Report Deployment Status
        run: |
          echo "=== Docker Compose Services ==="
          docker compose ps
          echo "=== CD Deployment Succeeded! ==="
